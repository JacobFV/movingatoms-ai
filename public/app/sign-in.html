<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#000000" />
<meta name="color-scheme" content="dark" />
<title>Sign in · Moving Atoms</title>
<link rel="icon" href="/app/favicon-dark.png" type="image/png" />
<link rel="preload" href="/fonts/generalsans-500.woff2" as="font" type="font/woff2" crossorigin />
<style>
  @font-face { font-family: "General Sans"; src: url("/fonts/generalsans-400.woff2") format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "General Sans"; src: url("/fonts/generalsans-500.woff2") format("woff2"); font-weight: 500; font-display: swap; }
  @font-face { font-family: "General Sans"; src: url("/fonts/generalsans-600.woff2") format("woff2"); font-weight: 600; font-display: swap; }
  :root { --bg: #000; --panel: #0d0d0d; --line: #232323; --line-2: #333; --fg: #f4f4f4; --fg-2: #9a9a9a; --err: #ff7a6b; --ok: #7ad89a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 "General Sans", -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  body { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; padding: 18px 24px; }
  .brand { display: inline-flex; align-items: center; gap: 9px; color: var(--fg); text-decoration: none; font-weight: 500; letter-spacing: -0.01em; }
  .brand img { height: 19px; width: auto; }
  main { flex: 1; display: grid; place-items: center; padding: 24px 16px 64px; }
  .card { width: 100%; max-width: 380px; }
  h1 { font-size: 26px; font-weight: 500; letter-spacing: -0.02em; margin: 0 0 6px; }
  .sub { color: var(--fg-2); margin: 0 0 26px; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 3px; margin-bottom: 22px; }
  .tabs button { all: unset; cursor: pointer; text-align: center; padding: 8px 0; border-radius: 7px; color: var(--fg-2); font-weight: 500; font-size: 14px; }
  .tabs button[aria-selected="true"] { background: #1c1c1c; color: var(--fg); }
  .tabs button:focus-visible { outline: 2px solid #fff; outline-offset: 1px; }
  label { display: block; font-size: 13px; color: var(--fg-2); margin: 0 0 6px; }
  .field { margin-bottom: 14px; }
  input { width: 100%; height: 44px; padding: 0 13px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; color: var(--fg); font: inherit; outline: none; transition: border-color .15s; }
  input:focus { border-color: #6d6d6d; }
  input.bad { border-color: var(--err); }
  .pw { position: relative; }
  .pw input { padding-right: 64px; }
  .pw button { all: unset; cursor: pointer; position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 13px; color: var(--fg-2); }
  .hint { font-size: 12.5px; color: var(--fg-2); margin: 6px 0 0; }
  .go { width: 100%; height: 44px; margin-top: 8px; border: 0; border-radius: 10px; background: #fff; color: #000; font: 500 15px/1 "General Sans", sans-serif; cursor: pointer; }
  .go:disabled { opacity: .6; cursor: default; }
  .msg { min-height: 22px; margin: 12px 0 0; font-size: 14px; color: var(--err); }
  .fine { margin-top: 28px; font-size: 12.5px; color: var(--fg-2); }
  .fine a { color: var(--fg-2); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header><a class="brand" href="/" aria-label="Moving Atoms home"><img src="/app/brand/mark-white.png" alt="" /><span>moving atoms</span></a></header>
<main>
  <div class="card">
    <h1 id="title">Sign in</h1>
    <p class="sub" id="sub">Open your projects and scans.</p>
    <div class="tabs" role="tablist" aria-label="Sign in or create an account">
      <button type="button" role="tab" id="tLogin" aria-selected="true" aria-controls="form">Sign in</button>
      <button type="button" role="tab" id="tRegister" aria-selected="false" aria-controls="form">Create account</button>
    </div>
    <form id="form" novalidate>
      <div class="field" id="nameRow" hidden>
        <label for="name">Name</label>
        <input id="name" name="name" autocomplete="name" maxlength="120" />
      </div>
      <div class="field">
        <label for="email">Work email</label>
        <input id="email" name="email" type="email" autocomplete="username" inputmode="email" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="pw">
          <input id="password" name="password" type="password" autocomplete="current-password" required minlength="8" maxlength="200" />
          <button type="button" id="show" aria-controls="password">Show</button>
        </div>
        <p class="hint" id="pwHint" hidden>At least 8 characters. There’s no password reset, so keep it somewhere safe.</p>
      </div>
      <button class="go" id="go" type="submit">Sign in</button>
      <p class="msg" id="msg" role="alert"></p>
    </form>
    <p class="fine">By continuing you agree to our <a href="/terms/">Terms</a> and <a href="/privacy/">Privacy policy</a>.</p>
  </div>
</main>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var params = new URLSearchParams(location.search);
  // `next` is a path inside the app (the app's router adds /app), or a site path like /dashboard/
  function target() {
    var n = params.get("next") || "/";
    if (!/^\/(?!\/)/.test(n)) n = "/";
    if (/^\/(app|dashboard|quote)(\/|$|\?)/.test(n)) return n;
    return "/app" + (n === "/" ? "/" : n);
  }
  var mode = params.get("mode") === "register" ? "register" : "login";
  function setMode(m) {
    mode = m;
    var reg = m === "register";
    $("tLogin").setAttribute("aria-selected", String(!reg));
    $("tRegister").setAttribute("aria-selected", String(reg));
    $("nameRow").hidden = !reg;
    $("pwHint").hidden = !reg;
    $("title").textContent = reg ? "Create your account" : "Sign in";
    $("sub").textContent = reg ? "Upload scans and get them back as Revit and IFC models." : "Open your projects and scans.";
    $("go").textContent = reg ? "Create account" : "Sign in";
    $("password").autocomplete = reg ? "new-password" : "current-password";
    $("msg").textContent = "";
  }
  $("tLogin").onclick = function () { setMode("login"); };
  $("tRegister").onclick = function () { setMode("register"); };
  $("show").onclick = function () {
    var p = $("password"), on = p.type === "password";
    p.type = on ? "text" : "password"; this.textContent = on ? "Hide" : "Show";
  };
  setMode(mode);

  // already signed in: straight on
  fetch("/app/api/auth/session?probe=1", { credentials: "same-origin", cache: "no-store" })
    .then(function (r) { if (r.ok) location.replace(target()); })
    .catch(function () {});
  setTimeout(function () { $("email").focus(); }, 30);

  $("form").addEventListener("submit", async function (e) {
    e.preventDefault();
    var email = $("email").value.trim(), password = $("password").value, name = $("name").value.trim();
    ["email", "password", "name"].forEach(function (k) { $(k).classList.remove("bad"); });
    var bad = null;
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) bad = ["email", "Enter a valid email address."];
    else if (!password) bad = ["password", "Enter your password."];
    else if (mode === "register" && password.length < 8) bad = ["password", "Use at least 8 characters for your password."];
    if (bad) { $(bad[0]).classList.add("bad"); $(bad[0]).focus(); $("msg").textContent = bad[1]; return; }
    var go = $("go"); go.disabled = true; $("msg").textContent = "";
    try {
      var r = await fetch("/app/api/auth/password", {
        method: "POST", credentials: "same-origin", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: email, password: password, name: name || undefined, mode: mode })
      });
      var j = await r.json().catch(function () { return {}; });
      if (!r.ok) {
        if (j.error === "no_account") setMode("register");
        if (j.error === "account_exists") setMode("login");
        throw new Error(j.message || "Something went wrong. Try again.");
      }
      location.replace(target());
    } catch (err) {
      $("msg").textContent = err.message;
      go.disabled = false;
    }
  });
})();
</script>
</body>
</html>
