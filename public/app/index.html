    <title>Moving Atoms</title>
    <script>
      // sign-in is its own page (/app/sign-in, email + password): when the app routes there, load that page
      ;(function () {
        var go = function () { if (/^\/app\/sign-in\/?$/.test(location.pathname)) location.replace(location.href) }
        ;['pushState', 'replaceState'].forEach(function (k) {
          var o = history[k]
          history[k] = function () { var r = o.apply(this, arguments); go(); return r }
        })
        addEventListener('popstate', go)
      })()
    </script>
